<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GuideMe</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; background: linear-gradient(135deg, #F0F2FF, #E8E4FF); }
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .auth-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(108,99,255,0.12);
    }
    .auth-logo { text-align: center; font-size: 32px; margin-bottom: 8px; }
    .auth-title { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .auth-sub { text-align: center; color: var(--text-light); font-size: 14px; margin-bottom: 28px; }
    .auth-card .btn { width: 100%; padding: 13px; font-size: 15px; margin-top: 8px; border-radius: 10px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-light); }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">🎓 GuideMe</a>
    <div class="nav-links">
      <a href="register.html">Register</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">👋</div>
      <h2 class="auth-title">Welcome Back!</h2>
      <p class="auth-sub">Login to continue your guidance journey</p>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password">
      </div>

      <div class="error-msg" id="loginError"></div>

      <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">Login</button>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // If already logged in, go to dashboard
    if (localStorage.getItem('jwt_token')) {
      window.location.href = 'dashboard.html';
    }

    // Allow Enter key
    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorDiv.style.display = 'none';

      if (!email || !password) {
        errorDiv.innerText = 'Please fill in all fields!';
        errorDiv.style.display = 'block';
        return;
      }

      btn.innerHTML = '<span class="spinner"></span> Logging in...';
      btn.disabled = true;

      try {
        const response = await fetch('http://localhost:8080/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('jwt_token', data.token);
          localStorage.setItem('user_email', data.email);
          localStorage.setItem('user_name', data.name);
          window.location.href = 'dashboard.html';
        } else {
          errorDiv.innerText = 'Invalid email or password. Try again!';
          errorDiv.style.display = 'block';
          btn.innerHTML = 'Login';
          btn.disabled = false;
        }
      } catch (err) {
        errorDiv.innerText = 'Cannot connect to server. Make sure backend is running!';
        errorDiv.style.display = 'block';
        btn.innerHTML = 'Login';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
