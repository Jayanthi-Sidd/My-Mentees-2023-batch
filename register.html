<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — GuideMe</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; background: linear-gradient(135deg, #F0F2FF, #E8E4FF); }
    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .auth-card {
      background: white; border-radius: 20px; padding: 40px;
      width: 100%; max-width: 460px;
      box-shadow: 0 8px 40px rgba(108,99,255,0.12);
    }
    .auth-logo { text-align: center; font-size: 32px; margin-bottom: 8px; }
    .auth-title { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .auth-sub { text-align: center; color: var(--text-light); font-size: 14px; margin-bottom: 28px; }
    .auth-card .btn { width: 100%; padding: 13px; font-size: 15px; margin-top: 8px; border-radius: 10px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-light); }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">🎓 GuideMe</a>
    <div class="nav-links">
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">🎓</div>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Start your career guidance journey today</p>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min 6 characters">
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Grade</label>
          <select id="regGrade">
            <option value="">Select Grade</option>
            <option value="Class 11">Class 11</option>
            <option value="Class 12">Class 12</option>
            <option value="UG 1st Year">UG 1st Year</option>
            <option value="UG 2nd Year">UG 2nd Year</option>
            <option value="UG 3rd Year">UG 3rd Year</option>
          </select>
        </div>
        <div class="form-group">
          <label>Stream</label>
          <select id="regStream">
            <option value="">Select Stream</option>
            <option value="Science">Science</option>
            <option value="Commerce">Commerce</option>
            <option value="Arts">Arts</option>
            <option value="Engineering">Engineering</option>
            <option value="Medicine">Medicine</option>
          </select>
        </div>
      </div>

      <div class="error-msg" id="regError"></div>

      <button class="btn btn-primary" id="registerBtn" onclick="handleRegister()">Create Account</button>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const grade = document.getElementById('regGrade').value;
      const stream = document.getElementById('regStream').value;
      const errorDiv = document.getElementById('regError');
      const btn = document.getElementById('registerBtn');

      errorDiv.style.display = 'none';

      if (!name || !email || !password || !grade || !stream) {
        errorDiv.innerText = 'Please fill in all fields!';
        errorDiv.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        errorDiv.innerText = 'Password must be at least 6 characters!';
        errorDiv.style.display = 'block';
        return;
      }

      btn.innerHTML = '<span class="spinner"></span> Creating Account...';
      btn.disabled = true;

      try {
        const response = await fetch('http://localhost:8080/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, grade, stream })
        });

        if (response.ok) {
          showToast('Account created! Please login 🎉', 'success');
          setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
          const msg = await response.text();
          errorDiv.innerText = msg || 'Registration failed. Try again!';
          errorDiv.style.display = 'block';
          btn.innerHTML = 'Create Account';
          btn.disabled = false;
        }
      } catch (err) {
        errorDiv.innerText = 'Cannot connect to server. Make sure backend is running!';
        errorDiv.style.display = 'block';
        btn.innerHTML = 'Create Account';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
