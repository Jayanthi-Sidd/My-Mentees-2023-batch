<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Paths — GuideMe</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .filter-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .filter-btn {
      padding: 8px 20px;
      border: 2px solid #E8E8F0;
      border-radius: 20px;
      background: white;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-light);
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .career-card {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
      border: 2px solid transparent;
    }
    .career-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }
    .career-name { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--text); }
    .career-info { font-size: 13px; color: var(--text-light); margin: 6px 0; line-height: 1.5; }
    .career-info strong { color: var(--text); }
    .salary-badge {
      display: inline-block;
      background: #D1FAE5;
      color: #065F46;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 10px;
    }

    .loading-state {
      text-align: center;
      padding: 60px;
      color: var(--text-light);
      font-size: 16px;
    }
    .loading-state .big-icon { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="dashboard.html" class="nav-logo">🎓 GuideMe</a>
    <div class="nav-links">
      <a href="dashboard.html">← Dashboard</a>
      <a href="ai-chat.html">🤖 AI Chat</a>
      <button class="btn btn-danger" onclick="logout()" style="padding:8px 16px;font-size:13px;">Logout</button>
    </div>
  </nav>

  <div class="page-wrapper">
    <h1 class="page-title">🗺️ Explore Career Paths</h1>
    <p class="page-subtitle">Find the perfect career based on your stream and interests</p>

    <!-- Filter Buttons -->
    <div class="filter-row">
      <button class="filter-btn active" data-stream="all" onclick="filterCareers(this)">🌟 All</button>
      <button class="filter-btn" data-stream="Science" onclick="filterCareers(this)">🔬 Science</button>
      <button class="filter-btn" data-stream="Commerce" onclick="filterCareers(this)">📊 Commerce</button>
      <button class="filter-btn" data-stream="Arts" onclick="filterCareers(this)">🎨 Arts</button>
    </div>

    <!-- Career Grid -->
    <div class="grid-3" id="careerGrid">
      <div class="loading-state" style="grid-column: 1/-1;">
        <div class="big-icon">⏳</div>
        <p>Loading careers...</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    checkLogin();

    const streamColors = {
      'Science': 'badge-science',
      'Commerce': 'badge-commerce',
      'Arts': 'badge-arts',
      'Engineering': 'badge-engineering'
    };

    async function loadCareers(stream = 'all') {
      const grid = document.getElementById('careerGrid');
      grid.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><div class="big-icon">⏳</div><p>Loading...</p></div>`;

      const endpoint = stream === 'all' ? '/api/career/all' : '/api/career/suggest?stream=' + stream;
      const data = await apiCall(endpoint);

      if (!data || data.length === 0) {
        grid.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><div class="big-icon">😕</div><p>No careers found for this stream.</p></div>`;
        return;
      }

      grid.innerHTML = '';
      data.forEach(career => {
        const badgeClass = streamColors[career.stream] || '';
        const card = document.createElement('div');
        card.className = 'career-card';
        card.innerHTML = `
          <div class="career-name">${career.careerName}</div>
          <span class="badge ${badgeClass}">${career.stream}</span>
          <div class="career-info" style="margin-top:12px;">📚 <strong>Subjects:</strong> ${career.subjects}</div>
          <div class="career-info">🏫 <strong>Top Colleges:</strong> ${career.topColleges}</div>
          <div class="career-info">💼 <strong>Job Roles:</strong> ${career.jobRoles}</div>
          <div class="salary-badge">💰 ${career.avgSalary}</div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCareers(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadCareers(btn.dataset.stream);
    }

    loadCareers();
  </script>
</body>
</html>
