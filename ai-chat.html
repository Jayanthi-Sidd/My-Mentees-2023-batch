<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Guidance — GuideMe</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .chat-wrapper {
      max-width: 800px;
      margin: 32px auto;
      padding: 0 24px;
    }
    .chat-header {
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      border-radius: 16px 16px 0 0;
      padding: 20px 24px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header-icon { font-size: 32px; }
    .chat-header h2 { font-size: 18px; font-weight: 700; }
    .chat-header p { font-size: 12px; opacity: 0.8; }

    .chat-box {
      background: white;
      min-height: 420px;
      max-height: 420px;
      overflow-y: auto;
      padding: 20px;
      border-left: 1px solid #EEE;
      border-right: 1px solid #EEE;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chips {
      background: #FAFAFA;
      padding: 12px 20px;
      border-left: 1px solid #EEE;
      border-right: 1px solid #EEE;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      background: #EEEEFF;
      color: var(--primary);
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: all 0.2s;
    }
    .chip:hover { background: var(--primary); color: white; }

    .message {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      max-width: 80%;
    }
    .message.user { margin-left: auto; flex-direction: row-reverse; }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .user .msg-bubble {
      background: var(--primary);
      color: white;
      border-radius: 16px 16px 4px 16px;
    }
    .ai .msg-bubble {
      background: #F0F2FF;
      color: var(--text);
      border-radius: 16px 16px 16px 4px;
    }
    .msg-icon { font-size: 24px; margin-top: 2px; }

    .loading-dots {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background: #F0F2FF;
      border-radius: 16px;
      width: fit-content;
    }
    .dot {
      width: 8px; height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    .chat-input-area {
      background: white;
      padding: 16px;
      border-radius: 0 0 16px 16px;
      border: 1px solid #EEE;
      display: flex;
      gap: 10px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #E8E8F0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      outline: none;
    }
    .chat-input-area input:focus { border-color: var(--primary); }
    #sendBtn { padding: 12px 24px; border-radius: 10px; font-size: 14px; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }
    .empty-state .big-icon { font-size: 56px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="dashboard.html" class="nav-logo">🎓 GuideMe</a>
    <div class="nav-links">
      <a href="dashboard.html">← Dashboard</a>
      <a href="career.html">Careers</a>
      <button class="btn btn-danger" onclick="logout()" style="padding:8px 16px;font-size:13px;">Logout</button>
    </div>
  </nav>

  <div class="chat-wrapper">

    <!-- Chat Header -->
    <div class="chat-header">
      <div class="chat-header-icon">🤖</div>
      <div>
        <h2>AI Career Guidance</h2>
        <p>Ask me anything about your career path!</p>
      </div>
    </div>

    <!-- Suggestion Chips -->
    <div class="chips">
      <button class="chip" onclick="useChip(this)">What careers suit Science stream?</button>
      <button class="chip" onclick="useChip(this)">Which colleges for Engineering?</button>
      <button class="chip" onclick="useChip(this)">Skills needed for Software Development?</button>
      <button class="chip" onclick="useChip(this)">How to prepare for IIT JEE?</button>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
      <div class="empty-state" id="emptyState">
        <div class="big-icon">💬</div>
        <p>Ask me anything about your career!<br>I'm here to guide you. 🚀</p>
      </div>
      <div class="loading-dots" id="loadingDots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Ask your career question here...">
      <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">Send 🚀</button>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    checkLogin();

    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function useChip(chip) {
      document.getElementById('chatInput').value = chip.innerText;
      sendMessage();
    }

    function addMessage(text, sender) {
      const emptyState = document.getElementById('emptyState');
      if (emptyState) emptyState.remove();

      const chatBox = document.getElementById('chatBox');
      const loadingDots = document.getElementById('loadingDots');

      const div = document.createElement('div');
      div.className = 'message ' + sender;

      if (sender === 'ai') {
        div.innerHTML = `
          <div class="msg-icon">🤖</div>
          <div class="msg-bubble">${text}</div>
        `;
      } else {
        div.innerHTML = `<div class="msg-bubble">${text}</div>`;
      }

      chatBox.insertBefore(div, loadingDots);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const question = input.value.trim();
      if (!question) return;

      const sendBtn = document.getElementById('sendBtn');
      const loadingDots = document.getElementById('loadingDots');

      addMessage(question, 'user');
      input.value = '';
      sendBtn.disabled = true;
      sendBtn.innerText = '...';
      loadingDots.style.display = 'flex';

      const chatBox = document.getElementById('chatBox');
      chatBox.scrollTop = chatBox.scrollHeight;

      const token = localStorage.getItem('jwt_token');
      try {
        const response = await fetch('http://localhost:8080/api/ai/guidance', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            question: question,
            stream: 'science',
            grade: '11'
          })
        });

        const data = await response.json();
        loadingDots.style.display = 'none';

        if (data && data.response) {
          addMessage(data.response, 'ai');
        } else {
          addMessage('Sorry, something went wrong. Please try again!', 'ai');
        }
      } catch (err) {
        loadingDots.style.display = 'none';
        addMessage('Cannot connect to server. Make sure backend is running!', 'ai');
      }

      sendBtn.disabled = false;
      sendBtn.innerText = 'Send 🚀';
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
